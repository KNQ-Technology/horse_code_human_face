detector:
  model_path: "yolov8n.pt"
  conf_threshold: 0.4
  iou_threshold: 0.5
  track_enabled: true
  tracker_name: "bytetrack.yaml"
  track_persist: true
  device: "0"

roi:
  x_min_ratio: 0.20
  x_max_ratio: 0.60
  y_min_ratio: 0.35
  y_max_ratio: 0.70
  orientation_mode: "left_assumed"

enhance:
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: 8
  gamma: 1.1
  bilateral_d: 5
  bilateral_sigma_color: 35
  bilateral_sigma_space: 35
  unsharp_sigma: 1.0
  unsharp_amount: 1.2
  adaptive_block_size: 31
  adaptive_c: 3

ocr:
  lang: "en"
  conf_threshold: 0.5
  whitelist: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  expected_min_len: 4
  expected_max_len: 4
  regex_pattern: "^[A-Z][0-9]{3}$"
  interval_frames: 5

fusion:
  window_size: 15
  vote_threshold: 0.65
  hold_seconds: 1.5
  lost_frame_limit: 15
  bad_frame_trigger: 12

runtime:
  input_video: ""
  output_video: ""
  output_json: ""
  progress_interval_frames: 20
  viz_mode: "display"
  target_direction: "right_to_left"
  direction_min_frames: 5
  direction_min_displacement: 30.0

# 骑手人脸：需要 (1) 可用的 Milvus Lite .db 路径 (2) horse_id/models 下 SCRFD/ArcFace ONNX
# 若 face_db_uri 指向不存在路径（如他人机器上的 /home/...），初始化会失败且整条人脸链路关闭（只保号码 OCR）。
# Windows：请改为本机 .db，或设置环境变量 FACE_DB_URI；无独显时请 face_device: cpu
rider_identity:
  face_db_uri: "rider.db"
  face_collection: "rider_faces"
  face_dim: 512
  face_min_score: 0.3
  face_device: "cuda"
  face_models_dir: "horse_id/models"
  horse_rider_map: ""
  feature_store_path: "outputs/rider_identity.sqlite"
  use_feature_store: true

vlm_fallback:
  enabled: true
  api_key: "sk-719e95ee5d37494b9951203864312e2d"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen3.5-plus"
  timeout: 300.0
  max_retries: 1
  cooldown_frames: 15

# 简化模式 Phase2：对裁剪图调 DashScope 兼容接口，必须用支持图像的多模态模型。
# 若填纯文本模型(如部分 qwen3.5-plus 路由)，API 会报错或无法解析号码，画面上全部为「?」。
vlm_video:
  model: "qwen-vl-max"
  segment_seconds: 15
  overlap_seconds: 3
  compress_crf: 28
  compress_scale: "672:380"
  fps: 2
