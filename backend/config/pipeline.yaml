detector:
  model_path: "yolov8n.pt"
  conf_threshold: 0.4
  iou_threshold: 0.5
  track_enabled: true
  tracker_name: "bytetrack.yaml"
  track_persist: true

roi:
  x_min_ratio: 0.18
  x_max_ratio: 0.5
  y_min_ratio: 0.18
  y_max_ratio: 0.62
  orientation_mode: "left_assumed"

enhance:
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: 8
  gamma: 1.1
  bilateral_d: 5
  bilateral_sigma_color: 35
  bilateral_sigma_space: 35
  unsharp_sigma: 1.0
  unsharp_amount: 1.2
  adaptive_block_size: 31
  adaptive_c: 3

ocr:
  lang: "en"
  conf_threshold: 0.5
  whitelist: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  expected_min_len: 3
  expected_max_len: 4
  regex_pattern: "^[A-Z][0-9]{2,3}$"
  interval_frames: 2

fusion:
  window_size: 15
  vote_threshold: 0.65
  hold_seconds: 1.5
  lost_frame_limit: 15
  bad_frame_trigger: 12

runtime:
  input_video: ""
  output_video: ""
  output_json: ""
  progress_interval_frames: 20
  viz_mode: "display"

rider_identity:
  face_db_uri: "/home/hshan/Hor-Peo_detect/rider.db"
  face_collection: "rider_faces"
  face_dim: 512
  face_min_score: 0.3
  face_device: "cuda"
  face_models_dir: "horse_id/models"
  horse_rider_map: ""
  feature_store_path: "outputs/rider_identity.sqlite"

vlm_fallback:
  enabled: true
  api_key: "sk-719e95ee5d37494b9951203864312e2d"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen-vl-max"
  timeout: 15.0
  max_retries: 1
  cooldown_frames: 10
